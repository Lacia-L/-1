<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考数学真题刷题 · 2021–2025</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5a8f'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E∫%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#20242a; --muted:#6b7280;
  --line:#e5e3dc; --accent:#1f5a8f; --accent-ink:#ffffff;
  --badge-single:#eef4fb; --badge-multi:#fdf0e3; --badge-fill:#eef4ee; --badge-solve:#f2eefb;
  --pick:#dce9f5; --warn:#a03d2a;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.7;}
header.app{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 20px 0;}
.app-inner{max-width:820px;margin:0 auto;}
h1{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:.2px;}
p.sub{margin:0 0 14px;color:var(--muted);font-size:13px;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:14px;}
.toolbar label{font-size:13px;color:var(--muted);}
.toolbar select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
button{border:none;cursor:pointer;font:inherit;}
.btn{background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-size:13px;}
.btn:hover{filter:brightness(.94)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
.spacer{flex:1}
.count{font-size:13px;color:var(--muted);}
main{max-width:820px;margin:0 auto;padding:20px;}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
.qn{font-weight:700;color:var(--ink);font-size:14px;}
.badge{font-size:12px;padding:2px 9px;border-radius:20px;font-weight:600;}
.b-single{background:var(--badge-single);color:var(--accent)}
.b-multi{background:var(--badge-multi);color:#9a6b1f}
.b-fill{background:var(--badge-fill);color:#2c6b45}
.b-solve{background:var(--badge-solve);color:#5b4a9b}
.meta-tag{font-size:12px;color:var(--muted);}
.q-stem{font-size:15.5px;white-space:pre-wrap;word-break:break-word;}
.q-stem .katex{font-size:0.95em;}
.q-opts{margin-top:12px;display:grid;gap:8px;}
.opt{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;white-space:pre-wrap;word-break:break-word;font-size:14.5px;}
.opt:hover{border-color:var(--accent);}
.opt.picked{background:var(--pick);border-color:var(--accent);}
.opt .katex{font-size:0.95em;}
.q-foot{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.q-answer{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
.q-answer.show{display:block;}
.ans-line{margin-bottom:8px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;}
.ans-line b{color:var(--accent);}
.sol{margin-top:6px;font-size:14px;color:#333;white-space:pre-wrap;word-break:break-word;}
.incomplete{color:var(--warn);font-weight:600;}
@media (max-width:600px){
  .q{padding:14px;}
  .q-stem{font-size:15px;}
  main{padding:14px;}
}
</style>
</head>
<body>
<header class="app">
  <div class="app-inner">
    <h1>高考数学真题刷题</h1>
    <p class="sub">2021–2025 · 新高考I/II卷、全国甲/乙卷 · 共 <span id="total"></span> 题 · 公式由 KaTeX 渲染</p>
    <div class="toolbar">
      <label>知识点
        <select id="f-kp"><option value="">全部</option></select>
      </label>
      <label>年份
        <select id="f-year"><option value="">全部</option></select>
      </label>
      <button class="btn" id="btn-all">显示全部答案</button>
      <button class="btn ghost" id="btn-clear">清除选中</button>
      <span class="spacer"></span>
      <span class="count" id="count">0 / 0</span>
    </div>
  </div>
</header>
<main id="list"></main>

<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
var ALL = QUESTION_DATA;
var state = { kp:'', year:'', showAll:false };

function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function renderTex(text){
  if(!text) return '';
  var parts = String(text).split(/(\\\([\s\S]*?\\\))/g);
  return parts.map(function(p){
    if(p.length>2 && p.slice(0,2)==='\\(' && p.slice(-2)==='\\)'){
      var f=p.slice(2,-2);
      try{ return katex.renderToString(f,{throwOnError:false,displayMode:false}); }
      catch(e){ return esc(p); }
    }
    return esc(p);
  }).join('');
}
function typeBadge(t){
  if(t==='单选') return '<span class="badge b-single">单选</span>';
  if(t==='多选') return '<span class="badge b-multi">多选</span>';
  if(t==='填空') return '<span class="badge b-fill">填空</span>';
  return '<span class="badge b-solve">解答题</span>';
}

function buildFilters(){
  var kps=[], years=[], i, q, seenK={}, seenY={};
  for(i=0;i<ALL.length;i++){ q=ALL[i];
    if(q.kp && !seenK[q.kp]){seenK[q.kp]=1;kps.push(q.kp);}
    if(q.year && !seenY[q.year]){seenY[q.year]=1;years.push(q.year);}
  }
  kps.sort(); years.sort(function(a,b){return a-b;});
  var elK=document.getElementById('f-kp'), elY=document.getElementById('f-year'), o;
  for(i=0;i<kps.length;i++){o=document.createElement('option');o.value=kps[i];o.textContent=kps[i];elK.appendChild(o);}
  for(i=0;i<years.length;i++){o=document.createElement('option');o.value=years[i];o.textContent=years[i];elY.appendChild(o);}
  document.getElementById('total').textContent=ALL.length;
}

function filtered(){
  return ALL.filter(function(q){
    if(state.kp && q.kp!==state.kp) return false;
    if(state.year && String(q.year)!==String(state.year)) return false;
    return true;
  });
}

function card(q){
  var opts='';
  if(q.type==='单选'||q.type==='多选'){
    var letters=['A','B','C','D'];
    for(var i=0;i<4;i++){
      if(q.opts[i]){
        opts += '<span class="opt" data-i="'+i+'"><span class="opt-letter">'+letters[i]+'.</span>'+renderTex(q.opts[i])+'</span>';
      }
    }
  }
  var ansTxt = q.ans==='见解析'||q.ans==='' ? (q.ans||'—') : q.ans;
  var solHtml = q.sol==='【信息不全】' ? '<div class="sol incomplete">解析：'+esc(q.sol)+'</div>'
              : (q.sol ? '<div class="sol">'+renderTex(q.sol)+'</div>' : '');
  var diff = q.diff&&q.diff!=='未知' ? '<span class="meta-tag">难度：'+esc(q.diff)+'</span>' : '';
  var i;
  return '<article class="q" data-id="'+q.id+'">'
    +'<div class="q-meta"><span class="qn">第'+q.id+'题</span>'+typeBadge(q.type)
    +'<span class="meta-tag">'+esc(q.year)+'</span><span class="meta-tag">'+esc(q.paper)+'</span>'
    +'<span class="meta-tag">'+esc(q.kp)+'</span>'+diff+'</div>'
    +'<div class="q-stem">'+renderTex(q.stem)+'</div>'
    +(opts?'<div class="q-opts">'+opts+'</div>':'')
    +'<div class="q-foot">'
    +'<button class="btn ghost t-ans">显示答案</button>'
    +'<span class="count">'+ (q.ans==='见解析'?'解答见下方解析':'') +'</span>'
    +'</div>'
    +'<div class="q-answer"><div class="ans-line"><b>答案：</b>'+renderTex(ansTxt)+'</div>'+solHtml+'</div>'
    +'</article>';
}

function render(){
  var list=filtered(), html=[], i;
  for(i=0;i<list.length;i++) html.push(card(list[i]));
  document.getElementById('list').innerHTML=html.join('');
  document.getElementById('count').textContent=list.length+' / '+ALL.length;
  if(state.showAll){ showHideAll(true); }
}

function showHideAll(show){
  var boxes=document.querySelectorAll('.q-answer'), b, i;
  for(i=0;i<boxes.length;i++){ boxes[i].classList.toggle('show',show); }
  document.getElementById('btn-all').textContent= show?'隐藏全部答案':'显示全部答案';
  document.getElementById('btn-all').dataset.shown=show?'1':'0';
}

document.getElementById('list').addEventListener('click',function(ev){
  var t=ev.target, ans, btn;
  // 选项高亮
  if(t.classList&&t.classList.contains('opt')){ t.classList.toggle('picked'); return; }
  // 每题答案切换
  btn=t.closest('.t-ans');
  if(btn){
    var q=btn.closest('.q');
    ans=q.querySelector('.q-answer');
    ans.classList.toggle('show');
    btn.textContent=ans.classList.contains('show')?'隐藏答案':'显示答案';
    return;
  }
});

document.getElementById('btn-all').addEventListener('click',function(){
  state.showAll=!state.showAll;
  showHideAll(state.showAll);
});
document.getElementById('btn-clear').addEventListener('click',function(){
  document.querySelectorAll('.opt.picked').forEach(function(o){o.classList.remove('picked');});
});
document.getElementById('f-kp').addEventListener('change',function(ev){ state.kp=ev.target.value; render(); });
document.getElementById('f-year').addEventListener('change',function(ev){ state.year=ev.target.value; render(); });

buildFilters();
render();
</script>
</body>
</html>
