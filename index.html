<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>高考数学刷题 · 真题 + 章节练习</title>

<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#20242a; --muted:#6b7280;
  --line:#e5e3dc; --accent:#1f5a8f; --accent-ink:#ffffff;
  --badge-single:#eef4fb; --badge-multi:#fdf0e3; --badge-fill:#eef4ee; --badge-solve:#f2eefb;
  --pick:#dce9f5; --warn:#a03d2a;
  --ok:#2c6b45; --ok-bg:#eef6f0; --no:#a03d2a; --no-bg:#f9ecea;
  --side-w:232px;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.7;}
button{border:none;cursor:pointer;font:inherit;}
.btn{background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-size:13px;}
.btn:hover{filter:brightness(.94)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ===== 布局：侧边栏 + 主区 ===== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--side-w);background:var(--surface);
  border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px;z-index:40;}
.brand{font-weight:700;font-size:16px;padding:2px 10px 14px;letter-spacing:.2px;}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px;}
.side-label{font-size:12px;color:var(--muted);padding:12px 10px 6px;letter-spacing:1px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  font-size:13.5px;cursor:pointer;color:var(--ink);}
.nav-item:hover{background:#f1efe8;}
.nav-item.active{background:var(--pick);color:var(--accent);font-weight:600;}
.nav-item .no{color:var(--muted);font-size:12px;width:18px;flex:none;}
.nav-item.active .no{color:var(--accent);}
.nav-item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item .cnt{font-size:11px;background:#eef0ee;color:var(--muted);border-radius:10px;padding:1px 7px;flex:none;}
.nav-item.active .cnt{background:#fff;color:var(--accent);}
.backdrop{display:none;}

.maincol{margin-left:var(--side-w);min-width:0;}
header.app{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px 0;}
.app-inner{max-width:820px;margin:0 auto;}
.hamburger{display:none;}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.2px;}
.head-row{display:flex;align-items:center;gap:10px;}
p.sub{margin:6px 0 0;color:var(--muted);font-size:13px;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0 14px;}
.toolbar label{font-size:13px;color:var(--muted);}
.toolbar select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
.spacer{flex:1}
.count{font-size:13px;color:var(--muted);}
.chap-head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:12px 0 14px;}
.chap-head .ct{font-size:15px;font-weight:700;}
.chap-head .cs{font-size:13px;color:var(--muted);}
.chap-head .cs b{color:var(--accent);font-weight:600;}
main{max-width:820px;margin:0 auto;padding:20px;}

/* ===== 题目卡片 ===== */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
.qn{font-weight:700;color:var(--ink);font-size:14px;}
.badge{font-size:12px;padding:2px 9px;border-radius:20px;font-weight:600;}
.b-single{background:var(--badge-single);color:var(--accent)}
.b-multi{background:var(--badge-multi);color:#9a6b1f}
.b-fill{background:var(--badge-fill);color:var(--ok)}
.b-solve{background:var(--badge-solve);color:#5b4a9b}
.b-vp{background:#eef4fb;color:var(--accent);border:1px dashed var(--accent);}
.meta-tag{font-size:12px;color:var(--muted);}
.st-chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;}
.st-done{background:#eef0ee;color:var(--muted);}
.st-ok{background:var(--ok-bg);color:var(--ok);}
.st-no{background:var(--no-bg);color:var(--no);}
.q-stem{font-size:15.5px;white-space:pre-wrap;word-break:break-word;}
.q-stem .katex{font-size:0.95em;}
.q-opts{margin-top:12px;display:grid;gap:8px;}
.opt{display:flex;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;white-space:pre-wrap;word-break:break-word;font-size:14.5px;}
.opt:hover{border-color:var(--accent);}
.opt.picked{background:var(--pick);border-color:var(--accent);}
.opt .katex{font-size:0.95em;}
.opt-letter{font-weight:600;flex:none;}
.q-fill{margin-top:12px;}
.q-fill input{width:100%;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;}
.q-fill input:focus{outline:2px solid var(--pick);border-color:var(--accent);}
.solve-note{margin-top:10px;font-size:13px;color:var(--muted);}
.fb{display:none;margin-top:12px;align-items:center;gap:6px;font-weight:600;font-size:14px;}
.fb.show{display:flex;}
.fb-ok{color:var(--ok);}
.fb-no{color:var(--no);}
.q-foot{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.q-ans,.q-solbox{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
.q-ans.show,.q-solbox.show{display:block;}
.ans-line{margin-bottom:8px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;}
.ans-line b{color:var(--accent);}
.sol{margin-top:6px;font-size:14px;color:#333;white-space:pre-wrap;word-break:break-word;}
.sol .katex,.q-ans .katex{font-size:.95em;}
.incomplete{color:var(--warn);font-weight:600;}

/* ===== 变式练习区 ===== */
.vp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 12px;}
.vp-head .vn{font-size:14px;font-weight:700;}
.vp-note{font-size:12.5px;color:var(--warn);}
.vp-banner{display:none;margin:0 0 16px;background:var(--ok-bg);border:1px solid #cfe3d6;
  color:var(--ok);border-radius:10px;padding:12px 16px;font-weight:600;font-size:14px;}
.vp-banner.show{display:block;}

/* ===== 底部答错弹出条 ===== */
.vp-bar{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);width:min(680px,92vw);
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px rgba(31,41,55,.18);padding:14px 18px;z-index:60;
  transition:transform .2s ease;}
.vp-bar.show{transform:translate(-50%,0);}
.vp-bar p{margin:0 0 10px;font-size:14px;}
.vp-bar .vp-actions{display:flex;gap:10px;flex-wrap:wrap;}
@media (prefers-reduced-motion:reduce){.vp-bar{transition:none;}}

/* ===== toast ===== */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;z-index:70;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== 移动端 ===== */
@media (max-width:760px){
  .sidebar{transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 24px rgba(0,0,0,.15);}
  .sidebar.open{transform:translateX(0);}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30;}
  .maincol{margin-left:0;}
  .hamburger{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
    border:1px solid var(--line);border-radius:8px;background:#fff;flex:none;}
  header.app{padding:12px 14px 0;}
  main{padding:14px;}
  .q{padding:14px;}
  .q-stem{font-size:15px;}
}
/* ===== 奶油萌系覆写（只改视觉，不动任何做题逻辑）===== */
:root{
  --bg:#FFF7F0; --surface:#ffffff; --ink:#4A4A4A; --muted:#8b7f76;
  --line:#ffe8e2; --accent:#FF9A76; --accent-ink:#ffffff;

body{

    radial-gradient(circle at 6% 10%, rgba(255,214,255,.5) 0, rgba(255,214,255,0) 22%),

/* 按钮：胶囊渐变（白粗字）；ghost 柔粉描边 */

  border-radius:999px;box-shadow:0 3px 10px rgba(255,182,193,.25);}

/* 变式 / 结果 / 弹窗面板 */
.vp-head .vn{color:#5B4B4B;}

/* 反馈 / 徽标 */
.fb-ok{color:var(--ok);} .fb-no{color:var(--no);}

.st-no{background:var(--no-bg);color:var(--no);}
.st-done{background:#fff0f0;color:#b07a70;}

/* 移动端：装饰仍贴边角且缩小，绝不盖题；题目区依旧纯色隔离 */
@media (max-width:760px){

  .d4{font-size:36px;bottom:12px;right:10px;}

<script>
/* ================= 工具：转义 / 公式渲染 ================= */
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function renderTex(text){
  if(!text) return '';
  var parts = String(text).split(/(\\\([\s\S]*?\\\))/g);
  return parts.map(function(p){
    if(p.length>2 && p.slice(0,2)==='\\(' && p.slice(-2)==='\\)'){
      var f=p.slice(2,-2);
      try{ return katex.renderToString(f,{throwOnError:false,displayMode:false}); }
      catch(e){ return esc(p); }
    }
    return esc(p);
  }).join('');
}
function typeBadge(t){
  if(t==='单选') return '<span class="badge b-single">单选</span>';
  if(t==='多选') return '<span class="badge b-multi">多选</span>';
  if(t==='填空') return '<span class="badge b-fill">填空</span>';
  return '<span class="badge b-solve">解答题</span>';
}

/*PURE-START  —— 纯函数区：不依赖 DOM，供 node 测试直接抽取 */
var KP_MAP = {
  '集合与简易逻辑':[1],
  '函数与导数':[2,3],
  '三角函数':[4],
  '数列':[5],
  '平面向量':[6],
  '不等式':[7],
  '立体几何':[8],
  '解析几何（圆锥曲线）':[9,10,11],
  '概率统计':[12],
  '复数':[13]
};
var CHAPTER_NAMES = {
  1:'集合与常用逻辑用语',2:'函数概念与基本初等函数',3:'导数及其应用',4:'三角函数',
  5:'数列',6:'平面向量',7:'不等式',8:'立体几何初步',9:'直线与方程',10:'圆',
  11:'圆锥曲线',12:'概率统计',13:'复数',14:'计数原理',15:'线性规划'
};

// 填空归一化：trim → 全角转半角 → 去空白 → 去 \( \) \[ \] → frac 递归转 a/b → 小写
function normalize(s){
  if(s==null) return '';
  s = String(s).trim();
  s = s.replace(/[\uFF01-\uFF5E]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);});
  s = s.replace(/\u3000/g,' ');
  s = s.replace(/\s+/g,'');
  s = s.replace(/\\[()[\]]/g,'');
  // 递归把 \dfrac{a}{b} / \frac{a}{b} 替换为 (a)/(b)，直到无匹配（先内层后外层）
  var prev;
  do{
    prev = s;
    s = s.replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)');
  }while(s!==prev);
  return s.toLowerCase();
}
// 尝试把归一化字符串解析为数值（支持 a/b 分数与小数，允许括号），失败返回 null
function tryNum(s){
  if(s==null) return null;
  s = String(s);
  var m = s.match(/^\((-?\d+(?:\.\d+)?)\)\/\((-?\d+(?:\.\d+)?)\)$/);
  if(m){ var b=parseFloat(m[2]); return b===0?null:parseFloat(m[1])/b; }
  m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){ var b2=parseFloat(m[2]); return b2===0?null:parseFloat(m[1])/b2; }
  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  return null;
}
// 判分：q 为题对象，user 为 {letters:[...], text:'...'}；返回 true/false/null(解答题不判分)
function gradeAnswer(q, user){
  user = user||{};
  var i, arr;
  if(q.type==='单选'){
    arr = (user.letters||[]);
    return arr.length===1 && arr[0]===String(q.ans).trim().toUpperCase();
  }
  if(q.type==='多选'){
    var ua = (user.letters||[]).slice().sort().join('');
    var ca = String(q.ans).trim().toUpperCase().split('').sort().join('');
    return ua===ca && ua.length>0;
  }
  if(q.type==='填空'){
    var a = normalize(user.text), b = normalize(q.ans);
    if(a===b) return true;
    var na = tryNum(a), nb = tryNum(b);
    if(na!==null && nb!==null && Math.abs(na-nb)<1e-9) return true;
    return false;
  }
  return null; // 解答大题不判分
}
// 章节练习变式池：同 vp、排除当前题与本轮已用，按数组顺序取 n 道
function pickChapterVariants(list, curVp, curId, usedIds, n){
  usedIds = usedIds||[];
  var out=[];
  for(var i=0;i<list.length;i++){
    var q=list[i];
    if(out.length>=n) break;
    if(q.vp!==curVp) continue;
    if(q.id===curId) continue;
    if(usedIds.indexOf(q.id)>=0) continue;
    out.push(q);
  }
  return out;
}
// 高考真题变式池：CHAPTER_DATA 中 chapterIndex ∈ KP_MAP[kp]；优先 vp 互不相同，不足再补齐
function pickGaokaoVariants(list, kp, kpMap, usedIds, n){
  usedIds = usedIds||[];
  var idxs = kpMap[kp]||[];
  var pool = [];
  var i;
  for(i=0;i<list.length;i++){ if(idxs.indexOf(list[i].chapterIndex)>=0) pool.push(list[i]); }
  var seenVp={}, out=[];
  for(i=0;i<pool.length;i++){
    if(out.length>=n) break;
    var q=pool[i];
    if(usedIds.indexOf(q.id)>=0) continue;
    if(!seenVp[q.vp]){ seenVp[q.vp]=1; out.push(q); }
  }
  for(i=0;i<pool.length;i++){
    if(out.length>=n) break;
    var q2=pool[i];
    if(usedIds.indexOf(q2.id)>=0) continue;
    if(out.indexOf(q2)<0) out.push(q2);
  }
  return out;
}

/* ================= 卡片渲染 ================= */
function qcard(q, opt){
  opt = opt||{};
  var rt = RT[q.id] || (RT[q.id]={});
  var letters=['A','B','C','D'];
  var i, opts='';
  if(q.type==='单选'||q.type==='多选'){
    for(i=0;i<4;i++){
      if(q.opts && q.opts[i]){
        opts += '<span class="opt" data-i="'+i+'"><span class="opt-letter">'+letters[i]+'.</span><span class="opt-t">'+renderTex(q.opts[i])+'</span></span>';
      }
    }
  }
  var fill = (q.type==='填空')
    ? '<div class="q-fill"><input type="text" class="fill-in" placeholder="输入答案后点提交作答" value="'+esc(rt.input||'')+'"></div>' : '';
  var solveNote = (q.type==='解答大题') ? '<div class="solve-note">解答题不自动判分，请自行作答后对照查看答案与解析。</div>' : '';
  var showSubmit = (q.type!=='解答大题');
  var ansTxt = (!q.ans || q.ans==='见解析') ? (q.ans||'—') : q.ans;
  var solHtml = (q.sol==='【信息不全】') ? '<div class="sol incomplete">'+esc(q.sol)+'</div>'
              : (q.sol ? '<div class="sol">'+renderTex(q.sol)+'</div>' : '');
  var diff = (q.diff && q.diff!=='未知') ? '<span class="meta-tag">难度：'+esc(q.diff)+'</span>' : '';
  var srcTag = opt.variant ? '<span class="badge b-vp">变式</span>' : '';

  var chip='';
  if(rt.done){ chip = rt.correct ? '<span class="st-chip st-ok">答对</span>' : '<span class="st-chip st-no">答错</span>'; }
  else if(PROG[q.id]){ chip = PROG[q.id].c ? '<span class="st-chip st-ok">答对</span>' : '<span class="st-chip st-no">答错</span>'; }

  var metaName = (opt.variant || state.view==='chapter') ? ('第 '+q.no+' 题') : ('第 '+q.id+' 题');
  var headMeta = state.view==='chapter' || opt.variant
    ? '<span class="meta-tag">'+esc(q.kp)+'</span>'+diff
    : '<span class="meta-tag">'+esc(q.year)+'</span><span class="meta-tag">'+esc(q.paper)+'</span><span class="meta-tag">'+esc(q.kp)+'</span>'+diff;

  var submitTxt = rt.done ? '重新作答' : '提交作答';
  var fb = rt.done
    ? ( rt.correct
        ? '<div class="fb fb-ok show"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="4 12 10 18 20 6"/></svg>回答正确</div>'
        : '<div class="fb fb-no show"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>回答错误</div>' )
    : '<div class="fb"></div>';

  var ansOpen = rt.ansOpen ? ' show' : '';
  var solOpen = rt.solOpen ? ' show' : '';
  var ansBtnTxt = rt.ansOpen ? '隐藏答案' : '查看答案';
  var solBtnTxt = rt.solOpen ? '隐藏解析' : '查看解析';

  return '<article class="q" data-id="'+esc(q.id)+'" data-variant="'+(opt.variant?1:0)+'">'
    +'<div class="q-meta"><span class="qn">'+metaName+'</span>'+typeBadge(q.type)+srcTag+chip+headMeta+'</div>'
    +'<div class="q-stem">'+renderTex(q.stem)+'</div>'
    +(opts?'<div class="q-opts">'+opts+'</div>':'')
    +fill+solveNote
    +'<div class="q-foot">'
    +(showSubmit?'<button class="btn t-submit">'+submitTxt+'</button>':'')
    +'<button class="btn ghost t-ans">'+ansBtnTxt+'</button>'
    +'<button class="btn ghost t-sol">'+solBtnTxt+'</button>'
    +'</div>'
    +fb
    +'<div class="q-ans'+ansOpen+'"><div class="ans-line"><b>答案：</b>'+renderTex(ansTxt)+'</div></div>'
    +'<div class="q-solbox'+solOpen+'">'+solHtml+'</div>'
    +'</article>';
}

function filteredGaokao(){

      if(PROG[q.id]){ done++; if(PROG[q.id].c) right++; }

  closeDrawer();

/* ================= 弹出条 / 变式题 ================= */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); },1600);
}
function showBar(){ document.getElementById('vpBar').classList.add('show'); }
function hideBar(){ document.getElementById('vpBar').classList.remove('show'); }

function loadVariants(curQ){
  var variants;
  if(state.view==='chapter'){
    variants = pickChapterVariants(CHAPTER_DATA, curQ.vp, curQ.id, state.usedVariants, 5);
  }else{
    variants = pickGaokaoVariants(CHAPTER_DATA, curQ.kp, KP_MAP, state.usedVariants, 5);
  }
  variants.forEach(function(v){ state.usedVariants.push(v.id); });
  hideBar();
  if(!variants.length){ toast('该知识点暂无可推荐的变式题'); return; }

  var head = '<div class="vp-head"><span class="badge b-vp">变式练习</span>'
           + '<span class="vn">同知识点巩固（'+variants.length+' 道）</span>'
           + (variants.length<5 ? '<span class="vp-note">该知识点变式题不足 5 道，已加载全部 '+variants.length+' 道</span>' : '')
           + '</div>'
           + '<div class="vp-banner" id="vpBanner"></div>';
  var html = head;
  for(var i=0;i<variants.length;i++) html += qcard(variants[i], {variant:true});
  var wrap = document.createElement('div');
  wrap.className='vp-section'; wrap.id='vpSection';
  wrap.innerHTML = html;
  document.getElementById('list').appendChild(wrap);
  state.variantBatch = { ids:variants.map(function(v){return v.id;}), total:variants.length, done:0, right:0 };
  wrap.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ================= 交互（事件委托） ================= */
function getLetters(card){
  var picked = card.querySelectorAll('.opt.picked'), out=[];
  picked.forEach(function(o){ out.push(['A','B','C','D'][parseInt(o.getAttribute('data-i'),10)]); });
  return out;
}

document.getElementById('list').addEventListener('click', function(ev){
  var t=ev.target;
  var card = t.closest ? t.closest('.q') : null;

  // 选项（兼容点击选项内部文字节点）
  var optEl = t.closest ? t.closest('.opt') : null;
  if(optEl){
    var qid = card.getAttribute('data-id');
    var rt = RT[qid]||(RT[qid]={});
    if(rt.done){ toast('已提交，可点“重新作答”后修改'); return; }
    // 单选互斥
    var q = BY_ID[qid];
    if(q.type==='单选'){
      card.querySelectorAll('.opt.picked').forEach(function(o){o.classList.remove('picked');});
      optEl.classList.add('picked');
    }else{
      optEl.classList.toggle('picked');
    }
    return;
  }

  // 提交 / 重新作答
  var sub = t.closest ? t.closest('.t-submit') : null;
  if(sub && card){
    var cid = card.getAttribute('data-id');
    var cq = BY_ID[cid];
    var cr = RT[cid]||(RT[cid]={});
    if(cr.done){ // 重新作答
      cr.done=false; cr.correct=false; cr.input='';
      card.querySelectorAll('.opt.picked').forEach(function(o){o.classList.remove('picked');});
      var fi=card.querySelector('.fill-in'); if(fi) fi.value='';
      card.querySelector('.t-submit').textContent='提交作答';
      var fb=card.querySelector('.fb'); fb.className='fb'; fb.innerHTML='';
      var chip=card.querySelector('.st-chip'); if(chip) chip.remove();
      return;
    }
    var letters = getLetters(card);
    var input = '';
    if(cq.type==='填空'){ var inp=card.querySelector('.fill-in'); input = inp?inp.value:''; cr.input=input; }
    if((cq.type==='单选'||cq.type==='多选') && !letters.length){ toast('请先作答再提交'); return; }
    if(cq.type==='填空' && !input.trim()){ toast('请先输入答案再提交'); return; }

    var ok = gradeAnswer(cq, {letters:letters, text:input});
    cr.done=true; cr.correct=ok;
    PROG[cid]={a:1,c:ok?1:0}; saveProg(PROG);

    // 反馈
    card.querySelector('.t-submit').textContent='重新作答';
    var fb2=card.querySelector('.fb');
    fb2.className='fb show '+(ok?'fb-ok':'fb-no');
    fb2.innerHTML = ok
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="4 12 10 18 20 6"/></svg>回答正确'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>回答错误';
    // 状态 chip
    var oldChip=card.querySelector('.st-chip'); if(oldChip) oldChip.remove();
    var m=card.querySelector('.q-meta');
    var sp=document.createElement('span');
    sp.className='st-chip '+(ok?'st-ok':'st-no'); sp.textContent=ok?'答对':'答错';
    m.insertBefore(sp, m.children[1]);

    // 变式批次进度
    var isVariant = card.getAttribute('data-variant')==='1';
    if(isVariant && state.variantBatch){
      state.variantBatch.done++;
      if(ok) state.variantBatch.right++;
      if(state.variantBatch.done>=state.variantBatch.total){
        var banner=document.getElementById('vpBanner');
        if(banner){ banner.textContent='本轮变式练习完成：答对 '+state.variantBatch.right+' / '+state.variantBatch.total; banner.classList.add('show'); }
      }
    }

    if(!ok && !isVariant){ showBar(); }
    if(ok){ hideBar(); }
    return;
  }

  // 查看答案 / 查看解析
  var ansBtn = t.closest ? t.closest('.t-ans') : null;
  if(ansBtn && card){
    var aid=card.getAttribute('data-id');
    var ar=RT[aid]||(RT[aid]={});
    if(card.getAttribute('data-variant')==='1' && !ar.done){ toast('先作答再对照效果更好'); return; }
    var box=card.querySelector('.q-ans');
    box.classList.toggle('show');
    ar.ansOpen=box.classList.contains('show');
    ansBtn.textContent = ar.ansOpen?'隐藏答案':'查看答案';
    return;
  }
  var solBtn = t.closest ? t.closest('.t-sol') : null;
  if(solBtn && card){
    var sid=card.getAttribute('data-id');
    var sr=RT[sid]||(RT[sid]={});
    if(card.getAttribute('data-variant')==='1' && !sr.done){ toast('先作答再对照效果更好'); return; }
    var sbox=card.querySelector('.q-solbox');
    sbox.classList.toggle('show');
    sr.solOpen=sbox.classList.contains('show');
    solBtn.textContent = sr.solOpen?'隐藏解析':'查看解析';
    return;
  }
});

function buildFilters(){
  var kps=[], years=[], seenK={}, seenY={}, i, q;
  for(i=0;i<QUESTION_DATA.length;i++){ q=QUESTION_DATA[i];
    if(q.kp && !seenK[q.kp]){seenK[q.kp]=1;kps.push(q.kp);}

}
