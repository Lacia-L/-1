<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>高考数学刷题 · 真题+章节练习</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.11/katex.min.css">

<style>

:root{
  --bg:#0a0a1a;
  --bg2:#0f0f23;
  --surface:rgba(255,255,255,.04);
  --surface2:rgba(255,255,255,.07);
  --ink:#e8e8f0;
  --muted:#8b8ba0;
  --line:rgba(255,255,255,.08);
  --accent:#6366f1;
  --accent2:#a855f7;
  --accent3:#ec4899;
  --cyan:#22d3ee;
  --green:#34d399;
  --red:#f87171;
  --yellow:#fbbf24;
  --side-w:260px;
  --shadow:0 4px 20px rgba(0,0,0,.3);
}
[data-theme="light"]{
  --bg:#f5f7fa;
  --bg2:#ffffff;
  --surface:rgba(0,0,0,.03);
  --surface2:rgba(0,0,0,.05);
  --ink:#1a1a2e;
  --muted:#6b7280;
  --line:rgba(0,0,0,.1);
  --accent:#4f46e5;
  --accent2:#7c3aed;
  --accent3:#db2777;
  --cyan:#0891b2;
  --green:#059669;
  --red:#dc2626;
  --yellow:#d97706;
  --shadow:0 4px 20px rgba(0,0,0,.08);
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{

  background:var(--bg);

  color:var(--ink);

  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;

  line-height:1.7;

  min-height:100vh;

  overflow-x:hidden;

}

/* 动态背景 */

.bg-grid{

  position:fixed;inset:0;z-index:-2;

  background-image:

    linear-gradient(rgba(99,102,241,.03) 1px,transparent 1px),

    linear-gradient(90deg,rgba(99,102,241,.03) 1px,transparent 1px);

  background-size:50px 50px;

}

.bg-glow{

  position:fixed;inset:0;z-index:-1;pointer-events:none;

  background:

    radial-gradient(ellipse 600px 400px at 10% 10%,rgba(99,102,241,.15),transparent),

    radial-gradient(ellipse 500px 500px at 90% 20%,rgba(168,85,247,.12),transparent),

    radial-gradient(ellipse 600px 400px at 50% 100%,rgba(236,72,153,.1),transparent);

  animation:glowMove 15s ease-in-out infinite alternate;

}

@keyframes glowMove{

  0%{opacity:.7;transform:scale(1)}

  100%{opacity:1;transform:scale(1.05)}

}

/* 加载动画 */

.loader{

  position:fixed;inset:0;z-index:999;

  background:var(--bg);

  display:flex;flex-direction:column;align-items:center;justify-content:center;

  transition:opacity .5s,visibility .5s;

}

.loader.hide{opacity:0;visibility:hidden}

.loader-ring{

  width:60px;height:60px;

  border:3px solid var(--line);

  border-top-color:var(--accent);

  border-radius:50%;

  animation:spin 1s linear infinite;

}

@keyframes spin{to{transform:rotate(360deg)}}

.loader-text{margin-top:16px;color:var(--muted);font-size:14px;letter-spacing:2px}



/* 侧边栏 */

.sidebar{

  position:fixed;top:0;left:0;bottom:0;width:var(--side-w);

  background:linear-gradient(180deg,rgba(15,15,35,.95),rgba(10,10,26,.98));

  border-right:1px solid var(--line);

  backdrop-filter:blur(20px);

  padding:20px 14px;z-index:40;

  overflow-y:auto;

}

.sidebar::-webkit-scrollbar{width:4px}

.sidebar::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}

.brand{

  font-size:18px;font-weight:800;

  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));

  -webkit-background-clip:text;-webkit-text-fill-color:transparent;

  background-clip:text;

  padding:4px 10px 16px;

  letter-spacing:.5px;

}

.brand small{

  display:block;font-weight:400;font-size:11px;color:var(--muted);

  margin-top:4px;-webkit-text-fill-color:var(--muted);letter-spacing:1px;

}

.side-label{

  font-size:11px;color:var(--muted);padding:14px 10px 6px;

  letter-spacing:2px;text-transform:uppercase;

}

.nav-item{

  display:flex;align-items:center;gap:10px;

  padding:10px 12px;border-radius:10px;

  font-size:13.5px;cursor:pointer;color:var(--ink);

  transition:all .2s;margin-bottom:2px;

  position:relative;overflow:hidden;

}

.nav-item::before{

  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;

  background:linear-gradient(180deg,var(--accent),var(--accent2));

  transform:scaleY(0);transition:transform .2s;

}

.nav-item:hover{background:var(--surface)}

.nav-item.active{

  background:linear-gradient(90deg,rgba(99,102,241,.15),rgba(168,85,247,.05));

  color:#fff;

}

.nav-item.active::before{transform:scaleY(1)}

.nav-item .no{color:var(--muted);font-size:12px;width:20px;flex:none;font-weight:600}

.nav-item.active .no{color:var(--accent)}

.nav-item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav-item .cnt{

  font-size:10px;background:var(--surface2);color:var(--muted);

  border-radius:10px;padding:2px 8px;flex:none;font-weight:600;

}

.nav-item.active .cnt{background:var(--accent);color:#fff}



/* 主区域 */

.maincol{margin-left:var(--side-w);min-height:100vh}

header.app{

  background:rgba(15,15,35,.8);

  backdrop-filter:blur(20px);

  border-bottom:1px solid var(--line);

  padding:20px 28px 16px;

  position:sticky;top:0;z-index:30;

}

.app-inner{max-width:900px;margin:0 auto}

.head-row{display:flex;align-items:center;gap:14px}

.hamburger{

  display:none;width:40px;height:40px;

  border:1px solid var(--line);border-radius:10px;

  background:var(--surface);color:var(--ink);

  align-items:center;justify-content:center;cursor:pointer;

}

.theme-toggle{
  width:40px;height:40px;
  border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .3s;
}
.theme-toggle:hover{background:var(--surface2);border-color:var(--accent);transform:rotate(15deg);}
.icon-moon{display:none;}
[data-theme="light"] .icon-sun{display:none;}
[data-theme="light"] .icon-moon{display:block;}

/* 回到顶部按钮 */
.back-to-top{
  position:fixed;right:24px;bottom:24px;
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transform:translateY(20px);
  transition:all .3s;z-index:50;
}
.back-to-top.show{opacity:1;visibility:visible;transform:translateY(0);}
.back-to-top:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(99,102,241,.4);}

h1{

  font-size:24px;font-weight:800;

  background:linear-gradient(135deg,#fff,var(--muted));

  -webkit-background-clip:text;-webkit-text-fill-color:transparent;

  background-clip:text;

}

p.sub{margin:6px 0 0;color:var(--muted);font-size:13px}

.toolbar{

  display:flex;flex-wrap:wrap;gap:12px;align-items:center;

  padding:16px 0 4px;

}

.toolbar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}

.toolbar select{

  font:inherit;font-size:13px;padding:8px 12px;

  border:1px solid var(--line);border-radius:10px;

  background:var(--surface);color:var(--ink);

  cursor:pointer;outline:none;transition:border-color .2s;

}

.toolbar select:focus{border-color:var(--accent)}
#f-search:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(99,102,241,.15);}

.spacer{flex:1}

.count{

  font-size:13px;color:var(--muted);

  background:var(--surface);padding:6px 14px;border-radius:20px;

  border:1px solid var(--line);

}

.count b{color:var(--cyan);font-weight:700}



/* 按钮 */

.btn{

  border:none;cursor:pointer;font:inherit;font-size:13px;

  padding:9px 18px;border-radius:10px;font-weight:600;

  transition:all .2s;position:relative;overflow:hidden;

}

.btn-primary{

  background:linear-gradient(135deg,var(--accent),var(--accent2));

  color:#fff;box-shadow:0 4px 15px rgba(99,102,241,.3);

}

.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.4)}

.btn-ghost{

  background:var(--surface);color:var(--ink);

  border:1px solid var(--line);

}

.btn-ghost:hover{background:var(--surface2);border-color:var(--accent)}

.btn-sm{padding:6px 14px;font-size:12px}



/* 统计卡片 */

.stats-row{

  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));

  gap:12px;margin-bottom:20px;

}

.stat-card{

  background:var(--surface);border:1px solid var(--line);

  border-radius:14px;padding:16px;

  backdrop-filter:blur(10px);

  transition:transform .2s,border-color .2s;

}

.stat-card:hover{transform:translateY(-3px);border-color:var(--accent)}

.stat-num{

  font-size:28px;font-weight:800;

  background:linear-gradient(135deg,var(--cyan),var(--accent));

  -webkit-background-clip:text;-webkit-text-fill-color:transparent;

  background-clip:text;

}

.stat-label{font-size:12px;color:var(--muted);margin-top:4px}



main{max-width:900px;margin:0 auto;padding:24px 28px 60px}



/* 题目卡片 */

.q{

  background:var(--surface);

  border:1px solid var(--line);

  border-radius:16px;padding:22px 24px;

  margin-bottom:18px;

  backdrop-filter:blur(10px);

  transition:all .3s;

  position:relative;overflow:hidden;

}

.q::before{

  content:'';position:absolute;top:0;left:0;right:0;height:2px;

  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));

  transform:scaleX(0);transform-origin:left;transition:transform .3s;

}

.q:hover{border-color:rgba(99,102,241,.3);transform:translateY(-2px)}

.q:hover::before{transform:scaleX(1)}

.q-meta{

  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;

}

.qn{font-weight:700;color:#fff;font-size:15px}

.badge{

  font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;

  letter-spacing:.5px;

}

.b-single{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.3)}

.b-multi{background:rgba(251,191,36,.15);color:var(--yellow);border:1px solid rgba(251,191,36,.3)}

.b-fill{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3)}

.b-solve{background:rgba(168,85,247,.15);color:var(--accent2);border:1px solid rgba(168,85,247,.3)}

.b-vp{background:rgba(236,72,153,.15);color:var(--accent3);border:1px dashed rgba(236,72,153,.4)}

.meta-tag{font-size:12px;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:6px}

.st-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}

.st-ok{background:rgba(52,211,153,.15);color:var(--green)}

.st-no{background:rgba(248,113,113,.15);color:var(--red)}

.st-done{background:var(--surface2);color:var(--muted)}



.q-stem{font-size:15.5px;white-space:pre-wrap;word-break:break-word;color:var(--ink)}

.q-stem .katex{font-size:.95em}



.q-opts{margin-top:16px;display:grid;gap:10px}

.opt{

  display:flex;gap:12px;padding:12px 16px;

  border:1px solid var(--line);border-radius:12px;

  cursor:pointer;white-space:pre-wrap;word-break:break-word;

  font-size:14.5px;transition:all .2s;background:var(--surface2);

}

.opt:hover{border-color:var(--accent);background:rgba(99,102,241,.08)}

.opt.picked{

  background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(168,85,247,.1));

  border-color:var(--accent);

  box-shadow:0 0 20px rgba(99,102,241,.2);

}

.opt.correct{

  background:linear-gradient(135deg,rgba(52,211,153,.15),rgba(34,211,238,.08));

  border-color:var(--green);

}

.opt.wrong{

  background:linear-gradient(135deg,rgba(248,113,113,.15),rgba(236,72,153,.08));

  border-color:var(--red);

}

.opt .katex{font-size:.95em}

.opt-letter{

  font-weight:700;flex:none;width:24px;height:24px;

  display:flex;align-items:center;justify-content:center;

  background:var(--surface);border-radius:6px;font-size:13px;

}

.opt.picked .opt-letter{background:var(--accent);color:#fff}



.q-fill{margin-top:16px}

.q-fill input{

  width:100%;font:inherit;font-size:15px;padding:12px 16px;

  border:1px solid var(--line);border-radius:12px;

  background:var(--surface2);color:var(--ink);outline:none;

  transition:border-color .2s,box-shadow .2s;

}

.q-fill input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}

.solve-note{margin-top:12px;font-size:13px;color:var(--yellow);background:rgba(251,191,36,.08);padding:10px 14px;border-radius:10px;border:1px solid rgba(251,191,36,.2)}



.fb{

  display:none;margin-top:14px;align-items:center;gap:8px;

  font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;

}

.fb.show{display:flex}

.fb-ok{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.3)}

.fb-no{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.3)}



.q-foot{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.q-ans,.q-solbox,.q-know{

  display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;

}

.q-ans.show,.q-solbox.show,.q-know.show{display:block}

.ans-line{margin-bottom:10px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}

.ans-line b{color:var(--cyan)}

.sol{margin-top:8px;font-size:14px;color:#c0c0d0;white-space:pre-wrap;word-break:break-word;line-height:1.8}

.sol .katex,.q-ans .katex{font-size:.95em}

.know-box{

  background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(168,85,247,.05));

  border:1px solid rgba(99,102,241,.2);border-radius:12px;

  padding:14px 18px;margin-top:8px;

}

.know-box .know-title{

  font-size:12px;color:var(--accent);font-weight:700;

  letter-spacing:1px;margin-bottom:6px;text-transform:uppercase;

}

.know-box .know-text{font-size:13.5px;color:#c0c0d0}



/* 变式练习 */

.vp-head{

  display:flex;align-items:center;gap:10px;flex-wrap:wrap;

  margin:28px 0 16px;padding:14px 18px;

  background:linear-gradient(135deg,rgba(236,72,153,.1),rgba(168,85,247,.05));

  border:1px solid rgba(236,72,153,.25);border-radius:14px;

}

.vp-head .vn{font-size:15px;font-weight:700;color:#fff}

.vp-note{font-size:12px;color:var(--yellow)}

.vp-banner{

  display:none;margin:0 0 18px;

  background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(34,211,238,.06));

  border:1px solid rgba(52,211,153,.3);color:var(--green);

  border-radius:14px;padding:16px 20px;font-weight:700;font-size:15px;

  text-align:center;

}

.vp-banner.show{display:block;animation:fadeInUp .4s}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}



/* 底部弹出条 */

.vp-bar{

  position:fixed;left:50%;bottom:24px;

  transform:translate(-50%,150%);

  width:min(600px,92vw);

  background:rgba(15,15,35,.95);

  border:1px solid rgba(236,72,153,.3);

  border-radius:18px;backdrop-filter:blur(20px);

  box-shadow:0 20px 50px rgba(0,0,0,.5);

  padding:18px 22px;z-index:60;

  transition:transform .3s cubic-bezier(.34,1.56,.64,1);

}

.vp-bar.show{transform:translate(-50%,0)}

.vp-bar p{margin:0 0 14px;font-size:14px;color:var(--ink)}

.vp-bar .vp-actions{display:flex;gap:10px;flex-wrap:wrap}



/* toast */

.toast{

  position:fixed;top:24px;left:50%;

  transform:translateX(-50%) translateY(-100px);

  background:linear-gradient(135deg,var(--accent),var(--accent2));

  color:#fff;font-size:13px;padding:10px 20px;border-radius:12px;

  z-index:70;opacity:0;transition:all .3s;

  box-shadow:0 10px 30px rgba(99,102,241,.4);font-weight:600;

}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}



/* 章节头 */

.chap-head{

  display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;

  padding:14px 0 6px;

}

.chap-head .ct{font-size:17px;font-weight:700;color:#fff}

.chap-head .cs{font-size:13px;color:var(--muted)}

.chap-head .cs b{color:var(--cyan);font-weight:700}



/* 移动端 */

.backdrop{display:none}

@media (max-width:820px){

  .sidebar{transform:translateX(-100%);transition:transform .3s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}

  .sidebar.open{transform:translateX(0)}

  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35;backdrop-filter:blur(4px)}

  .maincol{margin-left:0}

  .hamburger{display:inline-flex}

  header.app{padding:14px 16px 12px}

  main{padding:16px}

  .q{padding:16px}

  .stats-row{grid-template-columns:repeat(2,1fr)}

}

/* 移动端优化 */
@media (max-width:820px){
  .sidebar{width:280px!important}
  header.app{padding:12px 14px 10px!important}
  main{padding:12px!important}
  .q{padding:14px!important}
  .stats-row{grid-template-columns:repeat(2,1fr)!important;gap:10px}
  h1{font-size:20px!important}
  .app-sub{font-size:12px!important}
  .filter-bar{flex-wrap:wrap;gap:8px!important}
  .filter-bar select{min-width:100px;font-size:13px}
  .q-title{font-size:16px!important}
  .q-opts{margin-top:14px!important}
  .opt{padding:12px 14px!important;font-size:15px}
  .q-actions{flex-wrap:wrap;gap:8px!important}
  .q-actions button{padding:8px 14px!important;font-size:13px}
  .tag{font-size:11px!important;padding:2px 8px!important}
  .stats-card{padding:14px 12px!important}
  .stats-num{font-size:24px!important}
  .stats-label{font-size:11px!important}
}
@media (max-width:480px){
  .stats-row{gap:8px!important}
  .stats-num{font-size:20px!important}
  h1{font-size:18px!important}
  .q{padding:12px!important}
  .opt{padding:10px 12px!important;font-size:14px}
  .opt .key{width:28px!important;height:28px!important;font-size:13px}
  .filter-bar select{flex:1;min-width:80px}
  .brand{font-size:16px!important}
  .katex{font-size:1em!important;overflow-x:auto}
}
/* ===== 深度移动端适配 ===== */
/* 全局防止横向滚动 */
html, body {
  max-width: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
/* 题目容器允许横向滚动（公式长时） */
.q-title, .opt-text, .analysis-box, .knowledge-box {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
/* KaTeX公式自适应 */
.katex {
  font-size: 1.05em !important;
  white-space: nowrap;
}
.katex-display {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 0;
}
/* 超小屏幕 (<380px) */
@media (max-width: 380px) {
  .q-title { font-size: 15px !important; line-height: 1.8; }
  .opt { padding: 10px 10px !important; font-size: 13px !important; }
  .opt .key { width: 26px !important; height: 26px !important; font-size: 12px !important; }
  .q-actions button { padding: 6px 10px !important; font-size: 12px !important; }
  .stats-card { padding: 10px 8px !important; }
  .stats-num { font-size: 18px !important; }
  h1 { font-size: 16px !important; }
  .tag { font-size: 10px !important; padding: 1px 6px !important; }
}
/* 确保侧边栏在移动端隐藏 */
@media (max-width: 820px) {
  .sidebar {
    transform: translateX(-100%) !important;

<script>

/* ========== 主题切换 ========== */
function initTheme(){
  var saved = localStorage.getItem('gmath_theme') || 'dark';
  if(saved === 'light'){
    document.documentElement.setAttribute('data-theme','light');
  }
}
function toggleTheme(){

  if(current === 'light'){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('gmath_theme','dark');
  }else{
    document.documentElement.setAttribute('data-theme','light');
    localStorage.setItem('gmath_theme','light');
  }
}
initTheme();

/* ========== 回到顶部 ========== */
function initBackToTop(){
  var btn = document.getElementById('back-to-top');
  window.addEventListener('scroll', function(){
    if(window.scrollY > 300){
      btn.classList.add('show');
    }else{
      btn.classList.remove('show');
    }
  });
  btn.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });
}
initBackToTop();

/* ========== 工具函数 ========== */

function esc(s){

  return String(s).replace(/[&<>"']/g,function(c){

    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

  });

}

function renderTex(text){

  if(!text) return '';

  var parts = String(text).split(/(\\\([\s\S]*?\\\))/g);

  return parts.map(function(p){

    if(p.length>2 && p.slice(0,2)==='\\(' && p.slice(-2)==='\\)'){

      var f=p.slice(2,-2);

      try{ return katex.renderToString(f,{throwOnError:false,displayMode:false}); }

      catch(e){ return esc(p); }

    }

    return esc(p);

  }).join('');

}

function typeBadge(t){

  if(t==='单选') return '<span class="badge b-single">单选</span>';

  if(t==='多选') return '<span class="badge b-multi">多选</span>';

  if(t==='填空') return '<span class="badge b-fill">填空</span>';

  return '<span class="badge b-solve">解答题</span>';

}



/* ========== 知识点映射 ========== */

var KP_MAP = {

  '集合与简易逻辑':[1],

  '函数与导数':[2,3],

  '三角函数':[4],

  '数列':[5],

  '平面向量':[6],

  '不等式':[7],

  '立体几何':[8],

  '解析几何（圆锥曲线）':[9,10,11],

  '概率统计':[12],

  '复数':[13]

};

var CHAPTER_NAMES = {

  1:'集合与常用逻辑用语',2:'函数概念与基本初等函数',3:'导数及其应用',4:'三角函数',

  5:'数列',6:'平面向量',7:'不等式',8:'立体几何初步',9:'直线与方程',10:'圆',

  11:'圆锥曲线',12:'概率统计',13:'复数',14:'计数原理',15:'线性规划'

};



/* ========== 判分逻辑 ========== */

function normalize(s){

  if(s==null) return '';

  s = String(s).trim();

  s = s.replace(/[\uFF01-\uFF5E]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);});

  s = s.replace(/\u3000/g,' ');

  s = s.replace(/\s+/g,'');

  s = s.replace(/\\[()[\]]/g,'');

  var prev;

  do{ prev=s; s=s.replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)'); }while(s!==prev);

  return s.toLowerCase();

}

function tryNum(s){

  if(s==null) return null;

  s=String(s);

  var m=s.match(/^\((-?\d+(?:\.\d+)?)\)\/\((-?\d+(?:\.\d+)?)\)$/);

  if(m){var b=parseFloat(m[2]);return b===0?null:parseFloat(m[1])/b;}

  m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);

  if(m){var b2=parseFloat(m[2]);return b2===0?null:parseFloat(m[1])/b2;}

  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);

  return null;

}

function gradeAnswer(q,user){

  user=user||{};

  if(q.type==='单选'){

    var arr=(user.letters||[]);

    return arr.length===1 && arr[0]===String(q.ans).trim().toUpperCase();

  }

  if(q.type==='多选'){

    var ua=(user.letters||[]).slice().sort().join('');

    var ca=String(q.ans).trim().toUpperCase().split('').sort().join('');

    return ua===ca && ua.length>0;

  }

  if(q.type==='填空'){

    var a=normalize(user.text),b=normalize(q.ans);

    if(a===b) return true;

    var na=tryNum(a),nb=tryNum(b);

    if(na!==null && nb!==null && Math.abs(na-nb)<1e-9) return true;

    return false;

  }

  return null;

}



/* ========== 变式题选取 ========== */

function pickChapterVariants(list,curVp,curId,usedIds,n){

  usedIds=usedIds||[];var out=[];

  for(var i=0;i<list.length;i++){

    var q=list[i];

    if(out.length>=n) break;

    if(q.vp!==curVp) continue;

    if(q.id===curId) continue;

    if(usedIds.indexOf(q.id)>=0) continue;

    out.push(q);

  }

  return out;

}

function pickGaokaoVariants(list,kp,kpMap,usedIds,n){

  usedIds=usedIds||[];

  var idxs=kpMap[kp]||[];var pool=[];var i;

  for(i=0;i<list.length;i++){if(idxs.indexOf(list[i].chapterIndex)>=0) pool.push(list[i]);}

  var seenVp={},out=[];

  for(i=0;i<pool.length;i++){

    if(out.length>=n) break;

    var q=pool[i];

    if(usedIds.indexOf(q.id)>=0) continue;

    if(!seenVp[q.vp]){seenVp[q.vp]=1;out.push(q);}

  }

  for(i=0;i<pool.length;i++){

    if(out.length>=n) break;

    var q2=pool[i];

    if(usedIds.indexOf(q2.id)>=0) continue;

    if(out.indexOf(q2)<0) out.push(q2);

  }

  return out;

}



/* ========== 状态管理 ========== */

var state={view:'gaokao',chap:1,kp:'',year:'',type:'',search:'',showAll:false,usedVariants:[],variantBatch:null};

var RT={};

var PROG_KEY='gmath_prog_v2';

function loadProg(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{};}catch(e){return{};}}

function saveProg(p){try{localStorage.setItem(PROG_KEY,JSON.stringify(p));}catch(e){}}

var PROG=loadProg();

var BY_ID={};

if(typeof QUESTION_DATA!=='undefined') QUESTION_DATA.forEach(function(q){BY_ID[q.id]=q;});

if(typeof CHAPTER_DATA!=='undefined') CHAPTER_DATA.forEach(function(q){BY_ID[q.id]=q;});



/* ========== 侧边栏 ========== */

function buildSidebar(){
  var qLen = typeof QUESTION_DATA!=='undefined' ? QUESTION_DATA.length : 0;
  document.getElementById('cnt-gaokao').textContent=qLen;
  var box=document.getElementById('side-chapters');
  var chapterMap={};
  var chapterIndexMap={};
  var chapterOrder=[];
  if(typeof CHAPTER_DATA!=='undefined'){
    CHAPTER_DATA.forEach(function(q){
      var ch = q.chapter || ('第'+(q.chapterIndex||'?')+'章');
      if(!chapterMap[ch]){
        chapterMap[ch]=0;
        chapterIndexMap[ch] = q.chapterIndex || 999;
        chapterOrder.push(ch);
      }
      chapterMap[ch]++;
    });
  }
  chapterOrder.sort(function(a,b){
    return (chapterIndexMap[a]||999) - (chapterIndexMap[b]||999);
  });
  var html='';
  chapterOrder.forEach(function(ch, idx){
    html+='<div class="nav-item" data-chap="'+ch+'"><span class="no">'+(idx+1)+'</span>'
      +'<span class="nm">'+ch+'</span>'
      +'<span class="cnt">'+chapterMap[ch]+'</span></div>';
  });
  box.innerHTML=html;
}

/* ========== 统计 ========== */

function updateStats(){

  var total = (typeof QUESTION_DATA!=='undefined'?QUESTION_DATA.length:0) + (typeof CHAPTER_DATA!=='undefined'?CHAPTER_DATA.length:0);

  var done=0,right=0;

  for(var id in PROG){if(PROG[id]){done++;if(PROG[id].c)right++;}}

  document.getElementById('stat-total').textContent=total;

  document.getElementById('stat-done').textContent=done;

  document.getElementById('stat-right').textContent=right;

  document.getElementById('stat-rate').textContent=done>0?Math.round(right/done*100)+'%':'0%';

}



/* ========== 题目卡片渲染 ========== */

function qcard(q,opt){

  opt=opt||{};

  // 兼容两种题目格式
  q.stem = q.stem || q.question || '';
  q.ans = q.ans || q.answer || '';
  q.sol = q.sol || q.analysis || '';
  q.diff = q.diff || q.difficulty || '';
  q.kp = q.kp || q.knowledge || '';
  // 统一opts格式：新格式是[{key:A,text:...}]，旧格式是["选项1",...]
  if(!q.opts && q.options){
    q.opts = q.options.map(function(o){return o.text;});
  }
  q.opts = q.opts || [];

  var rt=RT[q.id]||(RT[q.id]={});

  var letters=['A','B','C','D'];

  var i,opts='';

  if(q.type==='单选'||q.type==='多选'){

    for(i=0;i<4;i++){

      if(q.opts && q.opts[i]){

        var cls='opt';

        if(rt.done){

          var isCorrect = q.type==='单选' ? letters[i]===q.ans : q.ans.indexOf(letters[i])>=0;

          if(isCorrect) cls+=' correct';

          else if(rt.picked && rt.picked.indexOf(i)>=0) cls+=' wrong';

        }else if(rt.picked && rt.picked.indexOf(i)>=0){

          cls+=' picked';

        }

        opts+='<span class="'+cls+'" data-i="'+i+'"><span class="opt-letter">'+letters[i]+'</span><span class="opt-t">'+renderTex(q.opts[i])+'</span></span>';

      }

    }

  }

  var fill=(q.type==='填空')

    ?'<div class="q-fill"><input type="text" class="fill-in" placeholder="输入答案后点提交作答" value="'+esc(rt.input||'')+'"></div>':'';

  var solveNote=(q.type==='解答大题')?'<div class="solve-note">解答题不自动判分，请自行作答后对照查看答案与解析。</div>':'';

  var showSubmit=(q.type!=='解答大题');

  var ansTxt=(!q.ans||q.ans==='见解析')?(q.ans||'—'):q.ans;

  var solHtml=(q.sol==='【信息不全】')?'<div class="sol" style="color:var(--yellow)">'+esc(q.sol)+'</div>'

              :(q.sol?'<div class="sol">'+renderTex(q.sol)+'</div>':'');

  var diff=(q.diff&&q.diff!=='未知')?'<span class="meta-tag">难度：'+esc(q.diff)+'</span>':'';

  var srcTag=opt.variant?'<span class="badge b-vp">变式</span>':'';

  var chip='';

  if(rt.done){chip=rt.correct?'<span class="st-chip st-ok">答对</span>':'<span class="st-chip st-no">答错</span>';}

  else if(PROG[q.id]){chip=PROG[q.id].c?'<span class="st-chip st-ok">答对</span>':'<span class="st-chip st-no">答错</span>';}



  var metaName=(opt.variant||state.view==='chapter')?('第 '+(q.no||q.id)+' 题'):('第 '+q.id+' 题');

  var headMeta=state.view==='chapter'||opt.variant

    ?'<span class="meta-tag">'+esc(q.kp||'')+'</span>'+diff

    :'<span class="meta-tag">'+esc(q.year||'')+'</span><span class="meta-tag">'+esc(q.paper||'')+'</span><span class="meta-tag">'+esc(q.kp||'')+'</span>'+diff;



  var submitTxt=rt.done?'重新作答':'提交作答';

  var fb=rt.done

    ?(rt.correct

      ?'<div class="fb fb-ok show"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="4 12 10 18 20 6"/></svg>回答正确，太棒了！</div>'

      :'<div class="fb fb-no show"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>回答错误，看看解析吧</div>')

    :'<div class="fb"></div>';



  var ansOpen=rt.ansOpen?' show':'';

  var solOpen=rt.solOpen?' show':'';

  var knowOpen=rt.knowOpen?' show':'';

  var ansBtnTxt=rt.ansOpen?'隐藏答案':'查看答案';

  var solBtnTxt=rt.solOpen?'隐藏解析':'查看解析';



  return '<article class="q" data-id="'+esc(q.id)+'" data-variant="'+(opt.variant?1:0)+'">'

    +'<div class="q-meta"><span class="qn">'+metaName+'</span>'+typeBadge(q.type)+srcTag+chip+headMeta+'</div>'

    +'<div class="q-stem">'+renderTex(q.stem)+'</div>'

    +(opts?'<div class="q-opts">'+opts+'</div>':'')

    +fill+solveNote

    +'<div class="q-foot">'

    +(showSubmit?'<button class="btn btn-primary btn-sm t-submit">'+submitTxt+'</button>':'')

    +'<button class="btn btn-ghost btn-sm t-ans">'+ansBtnTxt+'</button>'

    +'<button class="btn btn-ghost btn-sm t-sol">'+solBtnTxt+'</button>'

    +'<button class="btn btn-ghost btn-sm t-know">知识点</button>'

    +'</div>'

    +fb

    +'<div class="q-ans'+ansOpen+'"><div class="ans-line"><b>答案：</b>'+renderTex(ansTxt)+'</div></div>'

    +'<div class="q-solbox'+solOpen+'">'+solHtml+'</div>'

    +'<div class="q-know'+knowOpen+'"><div class="know-box"><div class="know-title">核心知识点</div><div class="know-text">'+renderTex(q.knowledge||generateKnowledge(q))+'</div></div>'+(q.tips?'<div class="know-box" style="margin-top:10px"><div class="know-title" style="color:var(--cyan)">答题技巧</div><div class="know-text">'+renderTex(q.tips)+'</div></div>':'')+'</div>'

    +'</article>';

}



function generateKnowledge(q){

  var kp=q.kp||'';

  var map={

    '集合与简易逻辑':'集合运算：交集取公共元素，并集取全部元素，补集取全集中剩余部分。',

    '复数':'复数运算：\\((a+bi)(c+di)=(ac-bd)+(ad+bc)i\\)，共轭复数实部相同虚部相反。',

    '立体几何':'线面垂直判定：直线垂直于平面内两条相交直线则垂直于该平面。',

    '三角函数':'诱导公式：奇变偶不变，符号看象限。和差公式注意符号。',

    '解析几何（圆锥曲线）':'圆锥曲线定义：椭圆到两焦点距离和为定值；双曲线为差；抛物线到焦点与准线距离相等。',

    '函数与导数':'导数几何意义：\\(f\'(x_0)\\) 为曲线在 \\(x_0\\) 处切线斜率。极值点导数为0。',

    '概率统计':'古典概型：\\(P(A)=\\dfrac{\\text{A包含基本事件数}}{\\text{总基本事件数}}\\)。',

    '平面向量':'向量垂直：\\(\\vec{a}\\cdot\\vec{b}=0\\)；向量平行：\\(\\vec{a}=\\lambda\\vec{b}\\)。',

    '数列':'等差数列：\\(a_n=a_1+(n-1)d\\)，\\(S_n=\\dfrac{n(a_1+a_n)}{2}\\)。',

    '不等式':'基本不等式：\\(a+b\\geq2\\sqrt{ab}\\)（\\(a,b>0\\)），等号当且仅当 \\(a=b\\)。'

  };

  return map[kp]||'本题考查'+kp+'的基本概念与运算，注意公式的准确应用。';

}

function vPool(kp){

function vShuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function vPick(kp,n){
  var pool=vShuffle(vPool(kp).slice());
  if(pool.length<n){
    var cat=String(kp).slice(0,2);
    var near=vShuffle(vAllQ().filter(function(q){ return q.kp!==kp && String(q.kp).indexOf(cat)===0; }));
    pool=pool.concat(near);
  }
  if(pool.length<n){
    pool=pool.concat(vShuffle(vAllQ().filter(function(q){ return q.kp!==kp; })));
  }
  return pool.slice(0,n);
}

function vAllQ(){
  var all=[];
  if(typeof QUESTION_DATA!=='undefined') all=all.concat(QUESTION_DATA);
  if(typeof CHAPTER_DATA!=='undefined') all=all.concat(CHAPTER_DATA);
  return all;
}

/* 知识点 → 换数引擎（按关键词） */
function vEngineFor(kp){
  var k=String(kp);
  if(/等比/.test(k)) return 'geom';
  if(/等差|数列/.test(k)) return 'arith';
  if(/概率|古典概型|分布/.test(k)) return 'prob';
  if(/导数|切线|极值/.test(k)) return 'deriv';
  if(/三角函数|正弦|余弦|诱导|恒等/.test(k)) return 'trig';
  if(/不等式|线性规划/.test(k)) return 'ineq';
  if(/斜率|直线|倾斜角/.test(k)) return 'line';
  if(/二次函数|最值/.test(k)) return 'quadFun';
  if(/二次方程|解方程|一元二次/.test(k)) return 'quadEq';
  return '';
}

/* ---- 换数变式引擎 ---- */
function vrnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function vpick(a){return a[Math.floor(Math.random()*a.length)];}
function vcomb(n,k){ if(k<0||k>n) return 0; var r=1,i; for(i=0;i<k;i++) r=r*(n-i)/(i+1); return Math.round(r); }
function vfrac(n,d){ if(d<0){n=-n;d=-d;} function g(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;} var gg=g(n,d); n/=gg; d/=gg; return d===1?String(n):n+"/"+d; }
function vpoly2(a,b,c){
  var s = a===1?"x²":(a===-1?"−x²":a+"x²");
  if(b!==0) s += (b>0?" + ":" − ") + (Math.abs(b)===1?"":Math.abs(b)) + "x";
  if(c!==0) s += (c>0?" + ":" − ") + Math.abs(c);
  return s;
}
var VGEN={
  quadEq:{label:'一元二次方程',fn:function(){
    var a=vpick([1,1,2]),r1=vpick([-5,-4,-3,-2,-1,1,2,3,4]),r2=vpick([-6,-5,-4,-3,-2,-1,1,2,3,4,5]);
    if(r2===r1) r2=r1+1;
    var b=-a*(r1+r2), c=a*r1*r2, lo=Math.min(r1,r2), hi=Math.max(r1,r2);
    return {stem:'解方程 '+vpoly2(a,b,c)+' = 0', ans:'x₁ = '+lo+'，x₂ = '+hi+'',
      sol:'分解为 '+a+'(x'+(lo<0?' + '+Math.abs(lo):' − '+lo)+')(x'+(hi<0?' + '+Math.abs(hi):' − '+hi)+') = 0，得 x₁ = '+lo+'，x₂ = '+hi+'。'};
  }},
  quadFun:{label:'二次函数最值',fn:function(){
    var a=vpick([1,1,-1,2,-2]),h=vrnd(-4,4),k=vrnd(-9,9);
    var b=-2*a*h,c=a*h*h+k,isMin=a>0;
    return {stem:'已知 f(x) = '+vpoly2(a,b,c)+'，求它的'+(isMin?'最小值':'最大值')+'，并写出取到时的 x。',
      ans:(isMin?'最小值':'最大值')+' = '+k+'，此时 x = '+h,
      sol:'配方得 f(x) = '+a+'(x'+(h<0?' + '+Math.abs(h):' − '+h)+')²'+(k===0?'':(k>0?' + '+k:' − '+Math.abs(k)))+'，顶点 ('+h+', '+k+')。'};
  }},
  ineq:{label:'一元二次不等式',fn:function(){
    var a=vpick([1,1,2]),r1=vrnd(-6,2),r2=r1+vrnd(1,7);
    var b=-a*(r1+r2),c=a*r1*r2,lt=Math.random()<0.5;
    return {stem:'解不等式 '+vpoly2(a,b,c)+' '+(lt?'< 0':'> 0'),
      ans:lt?(r1+' < x < '+r2):('x < '+r1+' 或 x > '+r2),
      sol:'先求根 x₁ = '+r1+'、x₂ = '+r2+'，开口向上，'+(lt?'两根之间为负。':'两根之外为正。')};
  }},
  arith:{label:'等差数列',fn:function(){
    var a1=vrnd(-6,10),d=vpick([-4,-3,-2,-1,1,2,3,4]),n=vrnd(6,14);
    var an=a1+(n-1)*d,s=n*(a1+an)/2;
    return {stem:'等差数列 {aₙ} 中 a₁ = '+a1+'，公差 d = '+d+'，求 a_'+n+' 与 S_'+n+'。',
      ans:'a_'+n+' = '+an+'，S_'+n+' = '+s,
      sol:'a_'+n+' = a₁+('+n+'−1)d = '+an+'；S_'+n+' = n(a₁+a_'+n+')/2 = '+s+'。'};
  }},
  geom:{label:'等比数列',fn:function(){
    var a1=vpick([1,1,2,3,-2]),q=vpick([2,3,-2,-3]),n=vrnd(4,8);
    var an=a1*Math.pow(q,n-1),s=a1*(Math.pow(q,n)-1)/(q-1);
    return {stem:'等比数列 {bₙ} 中 b₁ = '+a1+'，公比 q = '+q+'，求 b_'+n+' 与 T_'+n+'。',
      ans:'b_'+n+' = '+an+'，T_'+n+' = '+s,
      sol:'b_'+n+' = b₁q^('+(n-1)+') = '+an+'；T_'+n+' = b₁(1−q^n)/(1−q) = '+s+'。'};
  }},
  prob:{label:'概率（取球）',fn:function(){
    var N=vrnd(8,14),R=vrnd(2,Math.min(6,N-3)),k=vrnd(2,3);
    var tot=vcomb(N,k),none=vcomb(N-R,k),f=vfrac(tot-none,tot);
    return {stem:'袋中有 '+N+' 个球，其中 '+R+' 个红球，其余为白球。任取 '+k+' 个，求「至少有 1 个红球」的概率。',
      ans:f, sol:'总数 C('+N+','+k+') = '+tot+'；全白的取法 C('+(N-R)+','+k+') = '+none+'；所求 = 1 − '+none+'/'+tot+' = '+f+'。'};
  }},
  deriv:{label:'多项式求导',fn:function(){
    var a=vpick([1,2,-1]),b=vpick([1,-2,3]),c=vrnd(-5,5),x0=vrnd(-3,3),d=vrnd(-6,6);
    var f=a+'x³'+(b>0?' + '+b:' − '+Math.abs(b))+'x²'+(c>0?' + '+c+'x':' − '+Math.abs(c)+'x')+(d>0?' + '+d:' − '+Math.abs(d));
    var val=3*a*x0*x0+2*b*x0+c;
    return {stem:'已知 f(x) = '+f+'，求 f′('+x0+')。',
      ans:'f′('+x0+') = '+val,
      sol:'f′(x) = '+3*a+'x² + '+(2*b)+'x + '+c+'，代入 x = '+x0+' 得 '+val+'。'};
  }},
  line:{label:'直线的斜率',fn:function(){
    var x1=vrnd(-5,5),y1=vrnd(-5,5),dx=vpick([1,2,-1,-2,3,-3]),k=vpick([-3,-2,-1,1,2,3,4]);
    var x2=x1+dx,y2=y1+k*dx,b=y1-k*x1;
    return {stem:'已知 A('+x1+', '+y1+')、B('+x2+', '+y2+')，求直线 AB 的斜率 k 与方程。',
      ans:'k = '+k+'，y = '+k+'x'+(b>=0?' + '+b:' − '+Math.abs(b)),
      sol:'k = ('+y2+'−'+y1+')/('+x2+'−'+x1+') = '+k+'；代 A 点得 b = '+b+'。'};
  }},
  trig:{label:'特殊角三角函数',fn:function(){
    var T=[[30,'1/2','√3/2','√3/3'],[45,'√2/2','√2/2','1'],[60,'√3/2','1/2','√3']];
    var t=vpick(T),w=vpick(['sin','cos','tan']),val=w==='sin'?t[1]:(w==='cos'?t[2]:t[3]);
    return {stem:'求 '+w+t[0]+'° 的值。', ans:w+' '+t[0]+'° = '+val,
      sol:t[0]+'°：sin = '+t[1]+'，cos = '+t[2]+'，tan = '+t[3]+'。'};
  }}
};

var VKP_GEN={
  '数列':['arith','geom'],
  '概率统计':['prob'],
  '函数与导数':['deriv','quadFun'],
  '三角函数':['trig'],
  '不等式':['ineq'],
  '直线与方程':['line'],
  '解析几何（圆锥曲线）':['line'],
  '集合与简易逻辑':['quadEq'],
  '复数':[]
};

/* ---- 生成 ---- */
function vGenerate(i){
  var it=VSTATE.items[i], kp=it.kp;
  if(!kp){ if(typeof toast==='function') toast('先选这道题考的知识点'); return; }
  var reals=vPick(kp,3).map(function(q){
    return {kind:'real', id:q.id, stem:q.stem||q.question||'', opts:q.opts||q.options||[],
            ans:q.ans||q.answer||'', sol:q.sol||q.analysis||'', type:q.type||''};
  });
  var eng=[];
  var ek=vEngineFor(kp);
  if(ek && VGEN[ek]){ var v=VGEN[ek].fn(); v.label=VGEN[ek].label; eng.push(v); }
  VSTATE.out[i]={kp:kp, reals:reals, eng:eng.slice(0,1)};
  VSTATE.ans={};
  render();
}

/* ---- 渲染 ---- */
function vPanelHTML(){
  var kps=vKpList();
  var h='<datalist id="vc-kp-list">'+kps.map(function(k){return '<option value="'+esc(k)+'">';}).join('')+'</datalist>';
  h+='<div class="vc-head"><div><h2>拍一道，出三道同类</h2><p>照片只用来对照原题。选框里选它考的知识点，从题库里挑 3 道同知识点真题；再由规则引擎按同一题型换数字重出 1 道，答案和步骤都给。</p></div></div>';
  h+='<div class="vc-actions"><label class="btn btn-primary btn-sm" for="vc-file">拍照 / 选图</label>'+
     '<input id="vc-file" type="file" accept="image/*" multiple>'+
     '<button class="btn btn-ghost btn-sm" data-vadd="1">手动加一题</button>'+
     '<button class="btn btn-ghost btn-sm" data-vclear="1" style="margin-left:auto">清空</button></div>';
  if(!VSTATE.items.length){
    h+='<div class="vc-empty">还没有题目。点「拍照 / 选图」，一张照片算一题，可以一次选多张。</div>';
    return h;
  }

  VSTATE.items.forEach(function(it,idx){
    var sel=it.kp||'';
    h+='<div class="vc-card"><div class="vc-top"><span class="vc-no">第 '+(idx+1)+' 题</span>'+
       '<button class="btn btn-ghost btn-sm" data-vdel="'+idx+'">删除</button></div>';
    if(it.img) h+='<img class="vc-thumb" src="'+it.img+'">';
    h+='<div class="vc-kp">考的是<input class="vc-kpin" list="vc-kp-list" data-vkp="'+idx+'" value="'+esc(sel)+'" placeholder="输入或选择知识点，如 等差数列">'+
       '<button class="btn btn-primary btn-sm" data-vgen="'+idx+'" style="margin-left:auto">出 3 道同类题</button></div>';
    var out=VSTATE.out[idx];
    if(out){
      h+='<div class="vc-out">';
      out.reals.forEach(function(q,qi){
        var key=idx+'-r'+qi, picked=VSTATE.ans[key];
        h+='<div class="vc-q"><div class="lab">同类真题 '+(qi+1)+(q.type?' · '+q.type:'')+'</div>';
        h+='<div class="vc-qs">'+renderTex(q.stem)+'</div>';
        if(q.opts && q.opts.length===4 && q.type==='单选'){
          var L=['A','B','C','D'];
          h+='<div class="vc-opts">'+q.opts.map(function(o,oi){
            var cls='vc-opt';
            if(picked!==undefined){ if(L[oi]===q.ans) cls+=' right'; else if(oi===picked) cls+=' wrong'; }
            return '<div class="'+cls+'" data-vopt="'+key+'" data-vo="'+oi+'"><b style="min-width:16px">'+L[oi]+'</b><span>'+renderTex(o)+'</span></div>';
          }).join('')+'</div>';
        }
        h+='<div class="vc-sol'+(picked!==undefined?' show':'')+'" id="vs-'+key+'"><b>答案：</b>'+esc(q.ans)+'<br><b>解析：</b>'+renderTex(q.sol)+'</div>';
        h+='<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-vshowsol="'+key+'">看答案与解析</button></div>';
        h+='</div>';
      });
      out.eng.forEach(function(v){
        var key=idx+'-e0', picked=VSTATE.ans[key];
        h+='<div class="vc-q"><div class="lab">换数变式 · '+v.label+'</div><div class="vc-qs">'+renderTex(v.stem)+'</div>'+
           '<div class="vc-sol'+(picked!==undefined?' show':'')+'" id="vs-'+key+'"><b>答案：</b>'+renderTex(v.ans)+'<br><b>步骤：</b>'+renderTex(v.sol)+'</div>'+
           '<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-vshowsol="'+key+'">看答案与步骤</button></div></div>';
      });
      if(!out.reals.length && !out.eng.length) h+='<div class="vc-empty" style="margin-top:10px">题库里这个知识点暂时没有可用的题。</div>';
      h+='<div style="margin-top:10px"><button class="btn btn-ghost btn-sm" data-vgen="'+idx+'">再出一批</button></div>';
      h+='</div>';
    }
    h+='</div>';
  });
  return h;
}

/* ---- 事件 ---- */
function vBind(){
  var doc=document;
  doc.addEventListener('change', function(e){
    var f=e.target;
    if(f && f.id==='vc-file'){
      var files=[];
      for(var i=0;i<f.files.length;i++) files.push(f.files[i]);
      files.forEach(function(file){
        var it={img:'',kp:''};
        VSTATE.items.push(it);
        var idx=VSTATE.items.length-1;
        var fr=new FileReader();
        fr.onload=function(ev){
          var img=new Image();
          img.onload=function(){
            var sc=Math.min(1,640/img.width);
            var cv=doc.createElement('canvas');
            cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
            cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
            VSTATE.items[idx].img=cv.toDataURL('image/jpeg',.6);
            vSave(); render();
          };
          img.src=ev.target.result;
        };
        fr.readAsDataURL(file);
      });
      f.value='';
      vSave(); render();
      if(typeof toast==='function') toast('照片进来了，选一下它考的知识点');
      return;
    }
    if(f && f.getAttribute && f.getAttribute('data-vkp')!==null){
      var i=+f.getAttribute('data-vkp');
      VSTATE.items[i].kp=f.value.trim(); VSTATE.out[i]=null;
      vSave();
    }
  });

  doc.addEventListener('click', function(e){
    var t=e.target.closest('[data-vadd],[data-vclear],[data-vdel],[data-vgen],[data-vopt],[data-vshowsol]');
    if(!t) return;
    if(t.getAttribute('data-vadd')!==null){
      VSTATE.items.push({img:'',kp:''}); vSave(); render();
      if(typeof toast==='function') toast('加了一题，写清知识点就能出题');
      return;
    }
    if(t.getAttribute('data-vclear')!==null){
      if(!confirm('清空这一页的题目？照片也会删掉。')) return;
      VSTATE.items=[]; VSTATE.out={}; VSTATE.ans={}; vSave(); render(); return;
    }
    if(t.getAttribute('data-vdel')!==null){
      var di=+t.getAttribute('data-vdel');
      VSTATE.items.splice(di,1);
      VSTATE.out={}; VSTATE.ans={};
      vSave(); render(); return;
    }
    if(t.getAttribute('data-vgen')!==null){ vGenerate(+t.getAttribute('data-vgen')); return; }
    if(t.getAttribute('data-vopt')!==null){
      var key=t.getAttribute('data-vopt'), vo=+t.getAttribute('data-vo');
      if(VSTATE.ans[key]!==undefined) return;
      VSTATE.ans[key]=vo;
      var parts=key.split('-'), idx=+parts[0], qi=+parts[1].slice(1);
      var out=VSTATE.out[idx];
      var q=out&&out.reals[qi];
      var L=['A','B','C','D'];
      var ok=q && L[vo]===q.ans;
      render();
      if(typeof toast==='function') toast(ok?'对。这题可以过了。':'错在这儿正好，看解析把坑填上。');
      if(ok && q && q.type==='填空'){}
      return;
    }
    if(t.getAttribute('data-vshowsol')!==null){
      var sid='vs-'+t.getAttribute('data-vshowsol');
      var box=doc.getElementById(sid);
      if(box){ box.classList.toggle('show'); t.textContent=box.classList.contains('show')?'收起答案':'看答案'; }
      return;
    }
  });
}

vLoad();

vBind();

  location.hash='#variant';
  if(typeof closeDrawer==='function') closeDrawer();
});

buildSidebar();

route();
